<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Idea Business Maker</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    :root {
      --background: #090d16;
      --card: #121927;
      --input: #0b1120;
      --border: #263248;
      --primary: #38bdf8;
      --secondary: #818cf8;
      --text: #f8fafc;
      --muted: #94a3b8;
      --dim: #64748b;
      --success: #10b981;
      --warning: #fbbf24;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      padding: 40px 20px;
      background:
        radial-gradient(circle at top, #16213a 0%, transparent 45%),
        var(--background);
      color: var(--text);
      font-family: "Inter", sans-serif;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: auto;
    }

    header {
      margin-bottom: 28px;
      text-align: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      padding: 6px 12px;
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.08);
      color: var(--primary);
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 10px var(--success);
    }

    h1 {
      margin-bottom: 10px;
      font-size: clamp(32px, 5vw, 48px);
      letter-spacing: -0.05em;
    }

    .subtitle {
      max-width: 650px;
      margin: auto;
      color: var(--muted);
      line-height: 1.6;
    }

    .card,
    .report {
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgba(18, 25, 39, 0.94);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
    }

    .card {
      padding: 26px;
    }

    .pipeline {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }

    .step {
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--dim);
      font-size: 12px;
      text-align: center;
      transition: 0.2s;
    }

    .step.active {
      border-color: var(--primary);
      background: rgba(56, 189, 248, 0.08);
      color: var(--primary);
    }

    .step.completed {
      border-color: rgba(16, 185, 129, 0.45);
      color: var(--success);
    }

    .conversation {
      display: none;
      max-height: 350px;
      margin-bottom: 18px;
      overflow-y: auto;
    }

    .conversation.visible {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 85%;
      padding: 13px 16px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.5;
    }

    .message.user {
      align-self: flex-end;
      border: 1px solid rgba(56, 189, 248, 0.25);
      background: rgba(56, 189, 248, 0.08);
    }

    .message.agent {
      align-self: flex-start;
      border: 1px solid rgba(251, 191, 36, 0.25);
      background: rgba(251, 191, 36, 0.08);
      color: #fde68a;
    }

    textarea {
      width: 100%;
      min-height: 130px;
      padding: 16px;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      background: var(--input);
      color: var(--text);
      font: inherit;
      line-height: 1.5;
      transition: 0.2s;
    }

    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.12);
    }

    textarea::placeholder {
      color: var(--dim);
    }

    .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-top: 14px;
    }

    .hint {
      color: var(--dim);
      font-size: 12px;
    }

    button {
      border: none;
      cursor: pointer;
      font: inherit;
    }

    .primary-button {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 22px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #07101c;
      font-weight: 700;
      transition: 0.2s;
    }

    .primary-button:hover {
      transform: translateY(-1px);
    }

    .primary-button:disabled {
      cursor: not-allowed;
      transform: none;
      opacity: 0.5;
    }

    .spinner {
      display: none;
      width: 15px;
      height: 15px;
      border: 2px solid rgba(7, 16, 28, 0.3);
      border-top-color: #07101c;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .report {
      display: none;
      margin-top: 24px;
      padding: 30px;
    }

    .report.visible {
      display: block;
    }

    .report-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }

    .report-title {
      color: var(--primary);
      font-weight: 700;
    }

    .secondary-button {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
    }

    .secondary-button:hover {
      background: var(--border);
      color: var(--text);
    }

    .markdown {
      color: #cbd5e1;
      line-height: 1.75;
    }

    .markdown h1,
    .markdown h2,
    .markdown h3 {
      color: var(--text);
      letter-spacing: -0.02em;
    }

    .markdown h1 {
      margin-bottom: 18px;
      font-size: 26px;
    }

    .markdown h2 {
      margin: 28px 0 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      color: var(--primary);
      font-size: 20px;
    }

    .markdown h3 {
      margin: 20px 0 10px;
      font-size: 17px;
    }

    .markdown p,
    .markdown ul,
    .markdown ol {
      margin-bottom: 14px;
    }

    .markdown ul,
    .markdown ol {
      padding-left: 24px;
    }

    .markdown li {
      margin-bottom: 7px;
    }

    .error {
      margin-top: 12px;
      color: #fca5a5;
      font-size: 13px;
    }

    @media (max-width: 700px) {
      body {
        padding: 24px 14px;
      }

      .pipeline {
        grid-template-columns: repeat(2, 1fr);
      }

      .card,
      .report {
        padding: 20px;
      }

      .actions {
        align-items: stretch;
        flex-direction: column;
      }

      .primary-button {
        justify-content: center;
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <header>
      <div class="badge">
        <span class="badge-dot"></span>
        Agent online
      </div>

      <h1>Idea Business Maker</h1>

      <p class="subtitle">
        Validate your business idea with market research, realistic startup
        costs, and a practical execution roadmap.
      </p>
    </header>

    <section class="card">
      <div class="pipeline">
        <div class="step" id="stepClarify">1. Analyze</div>
        <div class="step" id="stepResearch">2. Research</div>
        <div class="step" id="stepCosts">3. Costs</div>
        <div class="step" id="stepRoadmap">4. Roadmap</div>
      </div>

      <div class="conversation" id="conversation"></div>

      <textarea
        id="ideaInput"
        placeholder="Describe your business idea, target customers, and location..."
      ></textarea>

      <div class="actions">
        <span class="hint">Press Cmd/Ctrl + Enter to submit</span>

        <button class="primary-button" id="sendButton">
          <span class="spinner" id="spinner"></span>
          <span id="buttonText">Run analysis</span>
        </button>
      </div>

      <p class="error" id="errorMessage"></p>
    </section>

    <section class="report" id="report">
      <div class="report-header">
        <span class="report-title">Business Analysis</span>
        <button class="secondary-button" id="copyButton">Copy report</button>
      </div>

      <article class="markdown" id="reportContent"></article>
    </section>
  </main>

  <script>
    const ideaInput = document.getElementById("ideaInput");
    const sendButton = document.getElementById("sendButton");
    const buttonText = document.getElementById("buttonText");
    const spinner = document.getElementById("spinner");
    const conversation = document.getElementById("conversation");
    const errorMessage = document.getElementById("errorMessage");
    const report = document.getElementById("report");
    const reportContent = document.getElementById("reportContent");
    const copyButton = document.getElementById("copyButton");

    const steps = [
      document.getElementById("stepClarify"),
      document.getElementById("stepResearch"),
      document.getElementById("stepCosts"),
      document.getElementById("stepRoadmap")
    ];

    let originalIdea = null;
    let history = [];
    let rawReport = "";

    function updateSteps(state) {
      steps.forEach(step => {
        step.classList.remove("active", "completed");
      });

      if (state === "working" || state === "clarifying") {
        steps[0].classList.add("active");
      }

      if (state === "completed") {
        steps.forEach(step => step.classList.add("completed"));
      }
    }

    function addMessage(text, type) {
      conversation.classList.add("visible");

      const message = document.createElement("div");
      message.className = `message ${type}`;
      message.textContent = text;

      conversation.appendChild(message);
      conversation.scrollTop = conversation.scrollHeight;
    }

    function setLoading(loading) {
      sendButton.disabled = loading;
      spinner.style.display = loading ? "block" : "none";
      buttonText.textContent = loading ? "Agent working..." : "Run analysis";
    }

    async function submitIdea() {
      const text = ideaInput.value.trim();

      if (!text || sendButton.disabled) {
        return;
      }

      errorMessage.textContent = "";
      report.classList.remove("visible");
      setLoading(true);
      updateSteps("working");

      if (originalIdea === null) {
        originalIdea = text;
      } else {
        history.push(text);
      }

      addMessage(text, "user");
      ideaInput.value = "";

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            idea: originalIdea,
            history: history
          })
        });

        if (!response.ok) {
          throw new Error(`Server returned status ${response.status}`);
        }

        const data = await response.json();

        if (data.message.startsWith("Error:")) {
          throw new Error(data.message);
        }

        if (data.needs_clarification) {
          updateSteps("clarifying");
          addMessage(data.message, "agent");
          ideaInput.placeholder = "Answer the clarification question...";
          ideaInput.focus();
        } else {
          updateSteps("completed");

          rawReport = data.message;
          reportContent.innerHTML = marked.parse(rawReport);
          report.classList.add("visible");

          originalIdea = null;
          history = [];
          conversation.innerHTML = "";
          conversation.classList.remove("visible");

          ideaInput.placeholder =
            "Describe another business idea, target customers, and location...";

          report.scrollIntoView({
            behavior: "smooth",
            block: "start"
          });
        }
      } catch (error) {
        errorMessage.textContent = error.message;
        updateSteps("clarifying");
      } finally {
        setLoading(false);
      }
    }

    sendButton.addEventListener("click", submitIdea);

    ideaInput.addEventListener("keydown", event => {
      if ((event.metaKey || event.ctrlKey) && event.key === "Enter") {
        event.preventDefault();
        submitIdea();
      }
    });

    copyButton.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(rawReport);
        copyButton.textContent = "Copied";

        setTimeout(() => {
          copyButton.textContent = "Copy report";
        }, 1500);
      } catch {
        copyButton.textContent = "Copy failed";
      }
    });
  </script>
</body>
</html>
