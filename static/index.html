<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Idea Business Maker</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { max-width: 760px; margin: 0 auto; padding: 40px 20px; background: #f6f1e7; color: #24201c; font: 16px Georgia, serif; line-height: 1.5; }
    header { border-bottom: 2px solid #24201c; margin-bottom: 28px; padding-bottom: 20px; }
    h1 { margin: 0 0 8px; font-size: 38px; }
    .subtitle { margin: 0; color: #655d52; }
    .badge { display: inline-block; margin-bottom: 14px; padding: 4px 8px; background: #d75a32; color: white; font: 12px Arial, sans-serif; text-transform: uppercase; }
    .badge-dot { display: none; }
    .card, .report { border: 1px solid #bdb4a6; background: #fffdf8; padding: 20px; }
    .pipeline { display: flex; flex-wrap: wrap; gap: 18px; margin-bottom: 20px; font: 13px Arial, sans-serif; }
    .step { color: #80776b; }
    .step.active { color: #d75a32; font-weight: bold; }
    .step.completed { color: #426d3c; font-weight: bold; }
    textarea { width: 100%; min-height: 140px; padding: 12px; border: 1px solid #bdb4a6; background: white; color: #24201c; font: inherit; resize: vertical; }
    .actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 12px; }
    .hint, .error { font: 12px Arial, sans-serif; }
    .hint { color: #80776b; }
    .error { color: #a32920; }
    button { border: 1px solid #24201c; padding: 9px 14px; background: #d75a32; color: white; cursor: pointer; font: 14px Arial, sans-serif; }
    button:hover { background: #ad4426; }
    button:disabled { opacity: .5; cursor: wait; }
    .spinner { display: none; }
    .conversation { display: none; margin-bottom: 16px; }
    .conversation.visible { display: block; }
    .message { margin: 8px 0; padding: 10px; border-left: 3px solid #bdb4a6; }
    .message.user { border-left-color: #d75a32; }
    .message.agent { border-left-color: #426d3c; }
    .report { display: none; margin-top: 24px; }
    .report.visible { display: block; }
    .report-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid #bdb4a6; }
    .secondary-button { background: white; color: #24201c; border-color: #bdb4a6; }
    .markdown { line-height: 1.7; }
    .markdown h2 { border-bottom: 1px solid #bdb4a6; padding-bottom: 6px; margin-top: 28px; }
    .markdown ul, .markdown ol { padding-left: 22px; }
    @media (max-width: 600px) { body { padding: 24px 14px; } h1 { font-size: 31px; } .actions { align-items: stretch; flex-direction: column; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="badge">Agent online</div>
      <h1>Idea Business Maker</h1>
      <p class="subtitle">Market research, startup costs, and a simple roadmap for your idea.</p>
    </header>
    <section class="card">
      <div class="pipeline">
        <span class="step" id="stepClarify">1. Analyze</span>
        <span class="step" id="stepResearch">2. Research</span>
        <span class="step" id="stepCosts">3. Costs</span>
        <span class="step" id="stepRoadmap">4. Roadmap</span>
      </div>
      <div class="conversation" id="conversation"></div>
      <textarea id="ideaInput" placeholder="Describe your business idea, customers, and location..."></textarea>
      <div class="actions">
        <span class="hint">Cmd/Ctrl + Enter to submit</span>
        <button id="sendButton"><span class="spinner" id="spinner"></span><span id="buttonText">Run analysis</span></button>
      </div>
      <p class="error" id="errorMessage"></p>
    </section>
    <section class="report" id="report">
      <div class="report-header">
        <strong>Business Analysis</strong>
        <button class="secondary-button" id="copyButton">Copy report</button>
      </div>
      <article class="markdown" id="reportContent"></article>
    </section>
  </main>
  <script>
    const ideaInput = document.getElementById("ideaInput");
    const sendButton = document.getElementById("sendButton");
    const buttonText = document.getElementById("buttonText");
    const conversation = document.getElementById("conversation");
    const errorMessage = document.getElementById("errorMessage");
    const report = document.getElementById("report");
    const reportContent = document.getElementById("reportContent");
    const copyButton = document.getElementById("copyButton");
    const steps = ["stepClarify", "stepResearch", "stepCosts", "stepRoadmap"].map(id => document.getElementById(id));
    let originalIdea = null;
    let history = [];
    let rawReport = "";
    function updateSteps(state) {
      steps.forEach(step => step.classList.remove("active", "completed"));
      if (state === "working" || state === "clarifying") steps[0].classList.add("active");
      if (state === "completed") steps.forEach(step => step.classList.add("completed"));
    }
    function addMessage(text, type) {
      conversation.classList.add("visible");
      const message = document.createElement("div");
      message.className = `message ${type}`;
      message.textContent = text;
      conversation.appendChild(message);
    }
    function setLoading(loading) {
      sendButton.disabled = loading;
      buttonText.textContent = loading ? "Working..." : "Run analysis";
    }
    async function submitIdea() {
      const text = ideaInput.value.trim();
      if (!text || sendButton.disabled) return;
      errorMessage.textContent = "";
      report.classList.remove("visible");
      setLoading(true);
      updateSteps("working");
      if (originalIdea === null) originalIdea = text;
      else history.push(text);
      addMessage(text, "user");
      ideaInput.value = "";
      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ idea: originalIdea, history })
        });
        if (!response.ok) throw new Error(`Server returned status ${response.status}`);
        const data = await response.json();
        if (data.message.startsWith("Error:")) throw new Error(data.message);
        if (data.needs_clarification) {
          updateSteps("clarifying");
          addMessage(data.message, "agent");
          ideaInput.placeholder = "Answer the question...";
          ideaInput.focus();
        } else {
          updateSteps("completed");
          rawReport = data.message;
          reportContent.innerHTML = marked.parse(rawReport);
          report.classList.add("visible");
          originalIdea = null;
          history = [];
          conversation.innerHTML = "";
          conversation.classList.remove("visible");
          ideaInput.placeholder = "Describe another business idea...";
          report.scrollIntoView({ behavior: "smooth" });
        }
      } catch (error) {
        errorMessage.textContent = error.message;
        updateSteps("clarifying");
      } finally {
        setLoading(false);
      }
    }
    sendButton.addEventListener("click", submitIdea);
    ideaInput.addEventListener("keydown", event => {
      if ((event.metaKey || event.ctrlKey) && event.key === "Enter") {
        event.preventDefault();
        submitIdea();
      }
    });
    copyButton.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(rawReport);
        copyButton.textContent = "Copied";
        setTimeout(() => copyButton.textContent = "Copy report", 1500);
      } catch {
        copyButton.textContent = "Copy failed";
      }
    });
  </script>
</body>
</html>
